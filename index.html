<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shelf — browse a curated catalog of films and books, filter by genre, and keep a watchlist and reading list."
    />
    <title>Shelf — Film &amp; Book Catalog</title>
    <meta property="og:title" content="Shelf — Film &amp; Book Catalog" />
    <meta
      property="og:description"
      content="A curated catalog of films and books. Search it, filter by genre, and keep a watchlist and reading list."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#faf7f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      ;(() => {
        try {
          const stored = localStorage.getItem('fbc:theme')
          const dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch {
          /* localStorage unavailable — stick with the light default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
